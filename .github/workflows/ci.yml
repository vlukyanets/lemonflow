name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Also validates the Gradle wrapper checksum. The runner image ships the Android SDK
      # (ANDROID_HOME) with licenses accepted; AGP downloads any missing platform.
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check assembleDebug
